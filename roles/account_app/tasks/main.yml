---
- name: Install required Python packages on Debian/Ubuntu
  package:
    name:
      - python3-pip
      - python3-dev
      - python3-venv    # add this line!
    state: latest
  when: ansible_os_family == "Debian"

- name: Install required Python packages on RHEL/CentOS/Alma
  package:
    name:
      - python3-pip
      - python3-devel    # RedHat equivalent
    state: latest
  when: ansible_os_family == "RedHat"
  
- name: Create RegUser on OOD
  user:
    name: "{{ RegUser_app_user }}"
    comment: "{{ RegUser_app_user_full_name }}"
    shell: /bin/bash
    createhome: no
    state: present
    system: yes
    
- name: Remove existing user register app install
  file:
    path: "{{ account_app_path }}"
    state: absent
    
- name: Ensure account_app_path exists with root ownership
  file:
    path: "{{ account_app_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
    
- name: Clone user register app form from gitlab
  git:
    repo: "{{ account_app_repo }}"
    dest: "{{ account_app_path }}"
    refspec: "{{ account_app_refspec }}"
    version: "{{ account_app_tag }}"

- name: Change ownership of directory
  file:
    path: "{{ account_app_path }}"
    owner: root
    group: root
    state: directory
    recurse: yes

- name: Create __pycache__ directories with proper ownership
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ RegUser_app_user }}"
    group: "{{ RegUser_app_user }}"
  loop:
    - "{{ account_app_path }}/__pycache__"
    - "{{ account_app_path }}/app/__pycache__"

- name: Copy Self-Reg app variables file
  template:
    src: app_vars.j2
    dest: "{{ account_app_path }}/app_vars.py"

- name: Install build dependencies for compiling Python packages
  package:
    name:
      - build-essential
      - python3-dev
      - libev-dev
      - libssl-dev
      - libffi-dev
    state: present
  become: yes
  when: ansible_os_family == "Debian"

- name: Install build dependencies for RHEL/CentOS
  package:
    name:
      - gcc
      - gcc-c++
      - python3-devel
      - libev-devel
      - openssl-devel
      - libffi-devel
    state: present
  become: yes
  when: ansible_os_family == "RedHat"
  
- name: Install Python packages in virtualenv
  pip:
    name:
      - amqp==2.5.2
      - billiard==4.2.1
      - celery==5.5.3
      - Click==7.0
      - dominate==2.4.0
      - Flask==1.1.1
      - Flask-Bootstrap==3.3.7.1
      - Flask-SocketIO==4.2.1
      - Flask-Testing==0.7.1
      - Flask-Cors==3.0.10
      - gevent==21.8.0
      - greenlet==2.0.2
      - importlib-metadata==1.5.0
      - itsdangerous==1.1.0
      - Jinja2==2.11.1
      - kombu==5.2.4
      - MarkupSafe==1.1.1
      - pika==1.1.0
      - python-engineio==3.11.2
      - python-socketio==4.4.0
      - pytz==2019.3
      - six==1.14.0
      - vine==5.0.0
      - visitor==0.1.3
      - Werkzeug==2.2.3
      - zipp==3.0.0
    virtualenv: "{{ account_app_path }}/venv"
    virtualenv_command: /usr/bin/python3 -m venv
    state: present
  become: yes


- name: Install gunicorn in virtualenv
  pip:
    name: gunicorn
    virtualenv: venv
    virtualenv_command: /usr/bin/python3 -m venv
    chdir: "{{ account_app_path }}"

- name: Create log directory
  file:
    path: "/var/log/{{ account_app }}"
    owner: "{{ RegUser_app_user }}"
    group: "{{ RegUser_app_user }}"
    state: directory

- name: Set up log rotate for module usage
  template:
    src: logrotate.j2
    dest: "/etc/logrotate.d/{{ account_app }}"

- name: Copy Celery service template
  template:
    src: celery.service.j2
    dest: "/etc/systemd/system/celery-{{ account_app }}.service"

- name: Enable celery.service
  systemd:
    name: celery-{{ account_app }}.service
    enabled: yes

- name: Put gunicorn config file in place
  template:
    src: ini.j2
    dest: "{{ account_app_path }}/{{ account_app }}.ini"

- name: Create gunicorn system service
  template:
    src: service.j2
    dest: "/etc/systemd/system/{{ account_app }}.service"

- name: Start and enable flask app gunicorn service
  service:
    name: "{{ account_app }}"
    enabled: yes
